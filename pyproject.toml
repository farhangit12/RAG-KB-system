[project]
name = "disha-rag"
version = "0.1.0"
description = "RAG knowledge assistant grounded in Disha's stories, frameworks, case studies and FAQs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Production: Oracle AI Vector Search (Account 1 Autonomous AI Database).
oracle = ["oracledb>=2.2"]
# Local models: bge-m3 embeddings, bge-reranker-v2-m3, exact token counts.
models = ["sentence-transformers>=3.0"]
# PDF and DOCX extraction (Docling, MIT) with basic fallbacks.
docs = ["docling>=2.0", "pypdf>=4.0", "python-docx>=1.1"]
# Optional local vector store for laptops without Oracle.
chroma = ["chromadb>=0.5"]
all = ["disha-rag[oracle,models,docs]"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI and Typer use calls in defaults by design.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Header",
    "typer.Argument", "typer.Option",
]
